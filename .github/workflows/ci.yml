name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-app.txt -r requirements-local.txt -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker image
        run: docker build -t brandpilot:local .
      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 8010:8010 brandpilot:local
          for i in $(seq 1 20); do
            curl -fs http://localhost:8010/api/health && curl -fs http://localhost:8010/metrics | head -n 5 && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  kubernetes:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: brandpilot
      - name: Build the image and load it into the cluster
        run: |
          docker build -t brandpilot:local .
          kind load docker-image brandpilot:local --name brandpilot
      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/brandpilot --timeout=180s
      - name: Check the service through a port-forward
        run: |
          kubectl port-forward service/brandpilot 8010:8010 &
          sleep 5
          curl -fs http://localhost:8010/api/health
          curl -fs http://localhost:8010/metrics | grep brandpilot_http_requests_total
      - name: Show pod state if anything failed
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deployment brandpilot
          kubectl logs deployment/brandpilot --tail=100

  publish:
    # Continuous delivery: every green build on main is pushed to GitHub Container Registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker, kubernetes]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amatya27/brandpilot:latest
            ghcr.io/amatya27/brandpilot:${{ github.sha }}
