name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-app.txt -r requirements-local.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker image
        run: docker build -t lora-brand-assistant:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 8010:8010 lora-brand-assistant:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8010/api/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
